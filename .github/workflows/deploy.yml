name: Deploy

# develop에 머지(push)되면 테스트를 다시 돌리고, 통과하면 EC2에 배포한다.
# AWS 키는 저장하지 않는다: GitHub OIDC로 odigo-github-deploy 역할을 잠깐 빌려 SSM으로 deploy.sh만 실행한다.
on:
  push:
    branches: [develop]
  workflow_dispatch: # Actions 화면에서 수동 재배포

# 배포가 겹치지 않게 한 번에 하나씩 (진행 중인 배포는 취소하지 않고 다음 배포가 기다린다)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  checks:
    name: Tests
    uses: ./.github/workflows/pr-checks.yml

  deploy:
    name: Deploy to EC2
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # OIDC 토큰 발급
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy.sh on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["bash /home/ubuntu/deploy.sh"],executionTimeout=["900"]' \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "----- deploy.sh output (마지막 부분) -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -n 30
          if [ "$STATUS" != "Success" ]; then
            echo "----- error -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -n 30
            exit 1
          fi

      - name: Health check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 12); do
            WEB=$(curl -fsS "$SITE_URL/" | grep -c 'id="root"' || true)
            API=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer dev-token-U001' \
              "$SITE_URL/orchestrator/payment-methods")
            echo "web=$WEB api=$API"
            if [ "$WEB" = "1" ] && [ "$API" = "200" ]; then
              echo "배포 확인 완료: $SITE_URL"
              exit 0
            fi
            sleep 10
          done
          echo "배포 후 사이트가 정상 응답하지 않습니다"
          exit 1
